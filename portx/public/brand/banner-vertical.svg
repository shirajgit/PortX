<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA6FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="headline" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="940" y2="0">
      <stop offset="0" stop-color="#4DA6FF"/>
      <stop offset="0.5" stop-color="#8FC4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="130"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#0A0F1E"/>
  <g filter="url(#blur)">
    <circle cx="540" cy="-20" r="320" fill="#4DA6FF" opacity="0.30"/>
    <circle cx="-20" cy="1700" r="280" fill="#7C5CFF" opacity="0.24"/>
    <circle cx="1100" cy="1000" r="240" fill="#39D98A" opacity="0.14"/>
  </g>

  <!-- logo -->
  <rect x="352" y="190" width="96" height="96" rx="22" fill="url(#mark)"/>
  <text x="400" y="259" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">P</text>
  <text x="472" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" fill="#E8EDF7">Port<tspan fill="#4DA6FF">xz</tspan></text>

  <!-- launch offer pill -->
  <rect x="190" y="340" width="700" height="60" rx="30" fill="#0E2018" stroke="#39D98A" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="226" cy="370" r="7" fill="#39D98A"/>
  <text x="552" y="379" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="25" fill="#39D98A">Launch offer — Pro for ₹49 · first 50 users</text>

  <!-- headline -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="98" font-weight="700" text-anchor="middle">
    <text x="540" y="560" fill="#E8EDF7">One profile.</text>
    <text x="540" y="672" fill="url(#headline)">Portfolio, resume</text>
    <text x="540" y="784" fill="url(#headline)">&amp; README</text>
    <text x="540" y="896" fill="#E8EDF7">always in sync.</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#8B98B8" text-anchor="middle">
    <text x="540" y="980">Edit once — your portfolio, resume PDF,</text>
    <text x="540" y="1028">and GitHub README update instantly.</text>
  </g>

  <!-- terminal -->
  <rect x="110" y="1090" width="860" height="350" rx="26" fill="#070C1A" stroke="#1E2C52" stroke-width="2"/>
  <path d="M111 1156 V1116 a25 25 0 0 1 25 -25 H944 a25 25 0 0 1 25 25 V1156 Z" fill="#0F1730"/>
  <line x1="111" y1="1156" x2="969" y2="1156" stroke="#1E2C52" stroke-width="2"/>
  <circle cx="150" cy="1124" r="9" fill="#FF5F57"/>
  <circle cx="180" cy="1124" r="9" fill="#FFB454"/>
  <circle cx="210" cy="1124" r="9" fill="#39D98A"/>
  <text x="242" y="1131" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#6B7A99">visitor@you — portfolio</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="28">
    <text x="150" y="1220"><tspan fill="#39D98A">visitor</tspan><tspan fill="#6B7A99">@</tspan><tspan fill="#4DA6FF">you</tspan><tspan fill="#6B7A99">:~$ </tspan><tspan fill="#E8EDF7">resume</tspan></text>
    <text x="150" y="1264" fill="#8B98B8">view resume | download PDF — always in sync</text>
    <text x="150" y="1336"><tspan fill="#39D98A">visitor</tspan><tspan fill="#6B7A99">@</tspan><tspan fill="#4DA6FF">you</tspan><tspan fill="#6B7A99">:~$ </tspan><tspan fill="#E8EDF7">sudo hire-me</tspan></text>
    <text x="150" y="1380" fill="#39D98A">✓ permission granted.</text>
  </g>

  <!-- CTA -->
  <rect x="220" y="1490" width="640" height="104" rx="26" fill="#4DA6FF"/>
  <text x="540" y="1555" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#04101F">Claim your username — free</text>
  <text x="540" y="1650" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#6B7A99">live in 3 minutes · free plan forever</text>
</svg>
