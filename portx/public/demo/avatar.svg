<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA6FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="400" height="400"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="330" cy="70" r="120" fill="#FFFFFF" opacity="0.10"/>

  <g clip-path="url(#frame)">
    <!-- shoulders -->
    <path d="M60 420 C60 318 128 282 200 282 C272 282 340 318 340 420 Z" fill="#0F1730"/>
    <path d="M170 284 L200 326 L230 284 Z" fill="#E8EDF7"/>
    <!-- neck -->
    <rect x="174" y="232" width="52" height="64" rx="22" fill="#C98F68"/>
    <!-- head -->
    <ellipse cx="200" cy="178" rx="72" ry="82" fill="#DDA57C"/>
    <!-- hair -->
    <path d="M124 176 C112 96 162 74 204 76 C254 78 292 108 276 180 C268 142 246 124 214 122 C178 120 142 134 124 176 Z" fill="#161B2E"/>
    <!-- glasses -->
    <g fill="none" stroke="#161B2E" stroke-width="6">
      <rect x="146" y="166" width="46" height="34" rx="12"/>
      <rect x="208" y="166" width="46" height="34" rx="12"/>
      <path d="M192 180 H208"/>
    </g>
    <!-- smile -->
    <path d="M176 222 Q200 240 224 222" fill="none" stroke="#8A4B33" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
